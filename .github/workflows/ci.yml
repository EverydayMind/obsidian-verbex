name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:bundle
      - name: Check repeated production builds
        run: node scripts/check-reproducible-build.mjs main.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-hash-${{ matrix.os }}
          path: main.sha256
          if-no-files-found: error
          retention-days: 1
  compare-bundles:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: main-hash-*
          path: hashes
      - name: Compare Ubuntu and Windows bundle hashes
        shell: bash
        run: |
          cmp hashes/main-hash-ubuntu-latest/main.sha256 hashes/main-hash-windows-latest/main.sha256
